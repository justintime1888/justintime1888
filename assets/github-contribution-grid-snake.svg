<svg xmlns="http://www.w3.org/2000/svg" width="720" height="110" viewBox="0 0 720 110" fill="none">
  <defs>
    <style>
      .cell { rx: 2px; ry: 2px; width: 10px; height: 10px; }
      .c0 { fill: #161b22; }
      .c1 { fill: #0e4429; }
      .c2 { fill: #006d32; }
      .c3 { fill: #26a641; }
      .c4 { fill: #39d353; }
      
      @keyframes snake_move {
        0% { transform: translate(0px, 0px); }
        25% { transform: translate(120px, 0px); }
        50% { transform: translate(240px, 24px); }
        75% { transform: translate(400px, 12px); }
        100% { transform: translate(0px, 0px); }
      }
      .snake-head { fill: #00f0ff; animation: snake_move 8s ease-in-out infinite; }
      .snake-body { fill: #0071e3; animation: snake_move 8s ease-in-out infinite; animation-delay: -0.15s; }
    </style>
  </defs>

