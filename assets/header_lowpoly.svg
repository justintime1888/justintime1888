<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" fill="none">
  <defs>
    <style>
      .name-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif; font-size: 32px; font-weight: 800; fill: #E2D0B6; letter-spacing: 0.08em; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif; font-size: 14px; font-weight: 500; fill: #F08D00; letter-spacing: 0.05em; }
      .meta { font-family: 'SF Mono', monospace; font-size: 12px; fill: #E2D0B6; opacity: 0.85; }
    </style>
  </defs>

  <!-- Low Poly Faceted Geometric Mesh Background -->
  <g id="low-poly-mesh">
    <!-- Row 1 Triangles -->
    <polygon points="0,0 80,0 40,50" fill="#10304A"/>
    <polygon points="80,0 170,0 120,45" fill="#143B5C"/>
    <polygon points="170,0 260,0 210,55" fill="#1A4A73"/>
    <polygon points="260,0 360,0 310,40" fill="#246869"/>
    <polygon points="360,0 460,0 410,50" fill="#2D7F80"/>
    <polygon points="460,0 560,0 510,45" fill="#993131"/>
    <polygon points="560,0 660,0 610,55" fill="#B03838"/>
    <polygon points="660,0 740,0 700,45" fill="#C65000"/>
    <polygon points="740,0 800,0 770,50" fill="#D95900"/>

    <!-- Fill connectors Row 1-2 -->
    <polygon points="0,0 40,50 0,90" fill="#0D263B"/>
    <polygon points="40,50 80,0 120,45" fill="#123552"/>
    <polygon points="120,45 170,0 210,55" fill="#184369"/>
    <polygon points="210,55 260,0 310,40" fill="#1F5B5C"/>
    <polygon points="310,40 360,0 410,50" fill="#287374"/>
    <polygon points="410,50 460,0 510,45" fill="#8A2C2C"/>
    <polygon points="510,45 560,0 610,55" fill="#A33434"/>
    <polygon points="610,55 660,0 700,45" fill="#BC4C00"/>
    <polygon points="700,45 740,0 770,50" fill="#CF5500"/>
    <polygon points="770,50 800,0 800,90" fill="#E05C00"/>

    <!-- Row 2 Triangles -->
    <polygon points="0,90 40,50 80,100" fill="#10304A"/>
    <polygon points="40,50 120,45 80,100" fill="#153E61"/>
    <polygon points="120,45 210,55 170,110" fill="#1C4F7A"/>
    <polygon points="120,45 170,110 80,100" fill="#163F63"/>
    <polygon points="210,55 310,40 260,105" fill="#246869"/>
    <polygon points="210,55 260,105 170,110" fill="#205E5F"/>
    <polygon points="310,40 410,50 360,110" fill="#2B7A7B"/>
    <polygon points="310,40 360,110 260,105" fill="#266D6E"/>
    <polygon points="410,50 510,45 460,115" fill="#993131"/>
    <polygon points="410,50 460,115 360,110" fill="#7E2828"/>
    <polygon points="510,45 610,55 560,105" fill="#B33A3A"/>
    <polygon points="510,45 560,105 460,115" fill="#A33434"/>
    <polygon points="610,55 700,45 660,110" fill="#C65000"/>
    <polygon points="610,55 660,110 560,105" fill="#B84A00"/>
    <polygon points="700,45 770,50 730,105" fill="#D65600"/>
    <polygon points="700,45 730,105 660,110" fill="#C95100"/>
    <polygon points="770,50 800,90 770,115" fill="#E66000"/>
    <polygon points="770,50 770,115 730,105" fill="#DE5B00"/>

    <!-- Row 3 Bottom Triangles -->
    <polygon points="0,90 80,100 0,180" fill="#0D263B"/>
    <polygon points="80,100 0,180 90,180" fill="#0F2D46"/>
    <polygon points="80,100 170,110 90,180" fill="#133857"/>
    <polygon points="170,110 90,180 190,180" fill="#184369"/>
    <polygon points="170,110 260,105 190,180" fill="#1D5354"/>
    <polygon points="260,105 190,180 290,180" fill="#246869"/>
    <polygon points="260,105 360,110 290,180" fill="#246869"/>
    <polygon points="360,110 290,180 390,180" fill="#2D7F80"/>
    <polygon points="360,110 460,115 390,180" fill="#6B2222"/>
    <polygon points="460,115 390,180 490,180" fill="#993131"/>
    <polygon points="460,115 560,105 490,180" fill="#993131"/>
    <polygon points="560,105 490,180 590,180" fill="#A83636"/>
    <polygon points="560,105 660,110 590,180" fill="#B34700"/>
    <polygon points="660,110 590,180 690,180" fill="#C65000"/>
    <polygon points="660,110 730,105 690,180" fill="#CC5300"/>
    <polygon points="730,105 690,180 770,180" fill="#D95900"/>
    <polygon points="730,105 770,115 770,180" fill="#E05D00"/>
    <polygon points="770,115 800,90 800,180" fill="#F08D00"/>
    <polygon points="770,115 800,180 770,180" fill="#EA8500"/>
  </g>

  <!-- Overlay Shading for Crisp Text Contrast -->
  <rect width="800" height="180" fill="rgba(16, 48, 74, 0.45)"/>
  <rect width="800" height="180" stroke="#E2D0B6" stroke-width="1.5" stroke-opacity="0.25" rx="10"/>

  <!-- Centered Typography & Badges -->
  <g transform="translate(400, 55)" text-anchor="middle">
    <text y="0" class="name-title">JUSTIN M. PARRA</text>
    <text y="32" class="sub-title">ELECTRICAL &amp; COMPUTER ENGINEERING • RUTGERS '27</text>
    <text y="62" class="meta">Lead Controls &amp; Firmware Engineer @ Autonomous Micromouse</text>
  </g>
</svg>
