<svg xmlns="http://www.w3.org/2000/svg" width="600" height="140" viewBox="0 0 600 140" fill="none">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
    <linearGradient id="bar_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif; font-size: 15px; font-weight: 600; fill: #ffffff; }
      .artist { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif; font-size: 13px; font-weight: 400; fill: #86868b; }
      .time { font-family: 'SF Mono', monospace; font-size: 11px; fill: #86868b; }
      .badge { font-family: -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #1DB954; letter-spacing: 0.05em; }
      
      @keyframes eq1 { 0%, 100% { height: 6px; } 50% { height: 24px; } }
      @keyframes eq2 { 0%, 100% { height: 22px; } 50% { height: 8px; } }
      @keyframes eq3 { 0%, 100% { height: 12px; } 50% { height: 26px; } }
      @keyframes eq4 { 0%, 100% { height: 28px; } 50% { height: 14px; } }
      @keyframes eq5 { 0%, 100% { height: 16px; } 50% { height: 28px; } }

      .bar1 { animation: eq1 1.2s ease-in-out infinite; }
      .bar2 { animation: eq2 0.9s ease-in-out infinite; }
      .bar3 { animation: eq3 1.4s ease-in-out infinite; }
      .bar4 { animation: eq4 1.1s ease-in-out infinite; }
      .bar5 { animation: eq5 0.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="140" rx="14" fill="url(#bg_grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Album Artwork / Cassette Box -->
  <rect x="20" y="20" width="100" height="100" rx="10" fill="#18181c" stroke="rgba(255,255,255,0.06)"/>
  
  <!-- Vinyl / Tape Icon in Art -->
  <circle cx="70" cy="70" r="32" fill="#121216" stroke="#1DB954" stroke-width="2"/>
  <circle cx="70" cy="70" r="20" fill="#18181c" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="70" cy="70" r="8" fill="#1DB954"/>

  <!-- Live Status Badge -->
  <rect x="140" y="22" width="128" height="20" rx="6" fill="rgba(29,185,84,0.12)" stroke="rgba(29,185,84,0.3)" stroke-width="1"/>
  <circle cx="152" cy="32" r="3" fill="#1DB954"/>
  <text x="162" y="36" class="badge">TOP SPOTIFY TRACK</text>

  <!-- Track Details -->
  <text x="140" y="62" class="title">Malcolm In The Middle</text>
  <text x="140" y="80" class="artist">Malcolm Todd — #1 Most Streamed Track</text>

  <!-- Progress Bar -->
  <rect x="140" y="98" width="430" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="140" y="98" width="310" height="4" rx="2" fill="url(#bar_grad)"/>
  <circle cx="450" cy="100" r="4" fill="#1DB954"/>

  <!-- Time Labels -->
  <text x="140" y="118" class="time">02:14</text>
  <text x="540" y="118" class="time">02:58</text>

  <!-- Animated Equalizer Bars -->
  <g transform="translate(530, 48)">
    <rect class="bar1" x="0" y="0" width="4" height="18" rx="2" fill="#1DB954" transform="scale(1, -1)"/>
    <rect class="bar2" x="7" y="0" width="4" height="22" rx="2" fill="#00f0ff" transform="scale(1, -1)"/>
    <rect class="bar3" x="14" y="0" width="4" height="14" rx="2" fill="#1DB954" transform="scale(1, -1)"/>
    <rect class="bar4" x="21" y="0" width="4" height="26" rx="2" fill="#00f0ff" transform="scale(1, -1)"/>
    <rect class="bar5" x="28" y="0" width="4" height="16" rx="2" fill="#1DB954" transform="scale(1, -1)"/>
  </g>
</svg>
