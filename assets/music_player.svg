<svg xmlns="http://www.w3.org/2000/svg" width="600" height="140" viewBox="0 0 600 140" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;display=swap');
      .title { font-family: 'Apple Garamond', 'EB Garamond', 'ITC Garamond', Garamond, serif; font-size: 18px; font-weight: 700; fill: #E2D0B6; letter-spacing: 0.02em; }
      .artist { font-family: 'Apple Garamond', 'EB Garamond', 'ITC Garamond', Garamond, serif; font-size: 14px; font-weight: 500; font-style: italic; fill: #F08D00; }
      .time { font-family: 'SF Mono', 'Courier New', monospace; font-size: 11px; fill: #E2D0B6; opacity: 0.85; }
      .badge { font-family: 'Apple Garamond', 'EB Garamond', Garamond, serif; font-size: 11px; font-weight: 700; fill: #E2D0B6; letter-spacing: 0.06em; }
      
      @keyframes eq1 { 0%, 100% { height: 6px; } 50% { height: 24px; } }
      @keyframes eq2 { 0%, 100% { height: 22px; } 50% { height: 8px; } }
      @keyframes eq3 { 0%, 100% { height: 12px; } 50% { height: 26px; } }
      @keyframes eq4 { 0%, 100% { height: 28px; } 50% { height: 14px; } }
      @keyframes eq5 { 0%, 100% { height: 16px; } 50% { height: 28px; } }

      .bar1 { animation: eq1 1.2s ease-in-out infinite; }
      .bar2 { animation: eq2 0.9s ease-in-out infinite; }
      .bar3 { animation: eq3 1.4s ease-in-out infinite; }
      .bar4 { animation: eq4 1.1s ease-in-out infinite; }
      .bar5 { animation: eq5 0.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Strict Retro Class Low-Poly Background -->
  <g id="retro-mesh">
    <polygon points="0,0 120,0 60,60" fill="#10304A"/>
    <polygon points="120,0 240,0 180,50" fill="#246869"/>
    <polygon points="240,0 360,0 300,55" fill="#993131"/>
    <polygon points="360,0 480,0 420,45" fill="#C65000"/>
    <polygon points="480,0 600,0 540,55" fill="#F08D00"/>

    <polygon points="0,0 60,60 0,140" fill="#0c2033"/>
    <polygon points="60,60 120,0 180,50" fill="#184369"/>
    <polygon points="60,60 180,50 120,140" fill="#10304A"/>
    <polygon points="180,50 240,0 300,55" fill="#246869"/>
    <polygon points="180,50 300,55 240,140" fill="#1d5455"/>
    <polygon points="300,55 360,0 420,45" fill="#993131"/>
    <polygon points="300,55 420,45 360,140" fill="#802929"/>
    <polygon points="420,45 480,0 540,55" fill="#C65000"/>
    <polygon points="420,45 540,55 480,140" fill="#ab4500"/>
    <polygon points="540,55 600,0 600,140" fill="#F08D00"/>

    <polygon points="0,140 60,60 120,140" fill="#10304A"/>
    <polygon points="120,140 180,50 240,140" fill="#246869"/>
    <polygon points="240,140 300,55 360,140" fill="#993131"/>
    <polygon points="360,140 420,45 480,140" fill="#C65000"/>
    <polygon points="480,140 540,55 600,140" fill="#F08D00"/>
  </g>

  <!-- Shading Overlay with Mosaic Base and Smooth Cream Border -->
  <rect width="600" height="140" rx="12" fill="#10304A" fill-opacity="0.82"/>
  <rect width="600" height="140" rx="12" stroke="#E2D0B6" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Album Artwork / Vinyl Box -->
  <rect x="20" y="20" width="100" height="100" rx="8" fill="#0B1926" stroke="#246869" stroke-width="1.2"/>
  <circle cx="70" cy="70" r="32" fill="#10304A" stroke="#F08D00" stroke-width="2"/>
  <circle cx="70" cy="70" r="20" fill="#0B1926" stroke="#E2D0B6" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="70" cy="70" r="8" fill="#E2D0B6"/>

  <!-- Badge in Stiletto (#993131) and Smooth Cream (#E2D0B6) -->
  <rect x="140" y="22" width="148" height="20" rx="4" fill="#993131" stroke="#C65000" stroke-width="1"/>
  <circle cx="152" cy="32" r="3" fill="#E2D0B6"/>
  <text x="162" y="36" class="badge">TODAY'S TOP TRACK</text>

  <!-- Track Details (Apple Garamond Serif) -->
  <text x="140" y="62" class="title">Malcolm In The Middle</text>
  <text x="140" y="80" class="artist">Malcolm Todd — Most Streamed Today</text>

  <!-- Progress Bar (Burnt Orange, Makoy Fruit & Smooth Cream) -->
  <rect x="140" y="98" width="430" height="4" rx="2" fill="#10304A" stroke="#246869" stroke-width="0.5"/>
  <rect x="140" y="98" width="310" height="4" rx="2" fill="#F08D00"/>
  <circle cx="450" cy="100" r="4" fill="#E2D0B6"/>

  <!-- Timestamps in Smooth Cream -->
  <text x="140" y="118" class="time">02:14</text>
  <text x="540" y="118" class="time">02:58</text>

  <!-- Animated Equalizer Bars in Retro Class Colors -->
  <g transform="translate(530, 48)">
    <rect class="bar1" x="0" y="0" width="4" height="18" rx="1.5" fill="#E2D0B6" transform="scale(1, -1)"/>
    <rect class="bar2" x="7" y="0" width="4" height="22" rx="1.5" fill="#F08D00" transform="scale(1, -1)"/>
    <rect class="bar3" x="14" y="0" width="4" height="14" rx="1.5" fill="#C65000" transform="scale(1, -1)"/>
    <rect class="bar4" x="21" y="0" width="4" height="26" rx="1.5" fill="#993131" transform="scale(1, -1)"/>
    <rect class="bar5" x="28" y="0" width="4" height="16" rx="1.5" fill="#246869" transform="scale(1, -1)"/>
  </g>
</svg>
